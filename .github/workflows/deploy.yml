name: 自動部署遊戲到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 檢出原始碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安裝專案依賴項 (Install Dependencies)
        run: npm ci

      - name: 編譯打包專案 (Build Project)
        run: npm run build

      - name: 設定 GitHub Pages (Configure Pages)
        uses: actions/configure-pages@v4

      - name: 上傳部署產物 (Upload Artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 部署至 GitHub Pages (Deploy to Pages)
        id: deployment
        uses: actions/deploy-pages@v4
